<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Chat App</title>
  <meta name="description" content="Create a new Chat App account with your phone number." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070b14; --surface: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.09);
      --accent: #6366f1; --accent-2: #8b5cf6; --accent-glow: rgba(99,102,241,0.35);
      --text: #f1f5f9; --muted: #94a3b8; --error: #f87171; --success: #34d399; --radius: 14px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .bg-blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.18; animation: drift 12s ease-in-out infinite alternate; pointer-events: none; z-index: 0; }
    .bg-blob.b1 { width: 520px; height: 520px; background: #8b5cf6; top: -120px; right: -120px; }
    .bg-blob.b2 { width: 400px; height: 400px; background: #6366f1; bottom: -100px; left: -80px; animation-delay: -5s; }
    .bg-blob.b3 { width: 260px; height: 260px; background: #ec4899; top: 40%; left: 10%; animation-delay: -8s; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.06); } }

    .card {
      position: relative; z-index: 1;
      background: var(--surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border); border-radius: 24px;
      padding: 44px 44px; width: 100%; max-width: 440px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
      animation: slideUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: none; } }

    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 20px var(--accent-glow); }
    .logo-text { font-size: 1.25rem; font-weight: 700; letter-spacing: -.5px; }
    h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -.5px; margin-bottom: 5px; }
    .subtitle { color: var(--muted); font-size: .875rem; margin-bottom: 26px; }

    /* Steps */
    .steps { display: flex; gap: 8px; margin-bottom: 28px; }
    .step { flex: 1; height: 3px; border-radius: 99px; background: var(--border); transition: background .4s; }
    .step.active   { background: var(--accent); }
    .step.done     { background: var(--success); }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: .78rem; font-weight: 500; color: var(--muted); margin-bottom: 7px; letter-spacing: .3px; text-transform: uppercase; }
    .input-wrap { position: relative; }
    .input-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 17px; height: 17px; pointer-events: none; }
    input[type="text"], input[type="password"], input[type="tel"] {
      width: 100%; padding: 12px 14px 12px 42px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-family: inherit;
      font-size: .93rem; outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input::placeholder { color: #4b5563; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); background: rgba(99,102,241,0.06); }
    .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: flex; align-items: center; transition: color .2s; }
    .toggle-pw:hover { color: var(--text); }

    /* OTP input row */
    .otp-hint { font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
    .otp-hint span { color: var(--accent); font-weight: 600; }

    .btn-primary {
      width: 100%; padding: 13px; border: none; border-radius: var(--radius);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-family: inherit; font-size: .93rem; font-weight: 600;
      cursor: pointer; letter-spacing: .3px; margin-top: 6px;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px var(--accent-glow);
      position: relative; overflow: hidden;
    }
    .btn-primary:hover:not(:disabled) { opacity: .92; }
    .btn-primary:active:not(:disabled) { transform: scale(.98); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .btn-secondary {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius);
      background: transparent; color: var(--muted); font-family: inherit; font-size: .875rem;
      font-weight: 500; cursor: pointer; margin-top: 8px;
      transition: border-color .2s, color .2s, background .2s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,0.05); }

    .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert { padding: 11px 14px; border-radius: 10px; font-size: .875rem; margin-bottom: 16px; display: none; animation: fadeIn .25s ease; }
    .alert.error   { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.25); color: var(--error); }
    .alert.success { background: rgba(52,211,153,.1);  border: 1px solid rgba(52,211,153,.25);  color: var(--success); }

    .links { margin-top: 20px; text-align: center; font-size: .875rem; color: var(--muted); }
    .links a { color: var(--accent); text-decoration: none; font-weight: 500; transition: color .2s; }
    .links a:hover { color: var(--accent-2); }

    /* Password strength */
    .pw-strength { margin-top: 6px; display: flex; gap: 4px; }
    .pw-bar { flex: 1; height: 3px; border-radius: 99px; background: var(--border); transition: background .3s; }
    .pw-label { font-size: .75rem; color: var(--muted); margin-top: 4px; }

    /* Resend timer */
    .resend-wrap { text-align: center; margin-top: 10px; font-size: .82rem; color: var(--muted); }
    .resend-wrap button { background: none; border: none; color: var(--accent); cursor: pointer; font-family: inherit; font-size: inherit; font-weight: 500; transition: color .2s; }
    .resend-wrap button:hover { color: var(--accent-2); }
    .resend-wrap button:disabled { color: var(--muted); cursor: default; }
  </style>
</head>
<body>
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">💬</div>
      <span class="logo-text">ChatApp</span>
    </div>

    <h1>Create Account</h1>
    <p class="subtitle">Enter your details and verify your phone number</p>

    <!-- Step indicators -->
    <div class="steps">
      <div class="step active" id="step-1-bar"></div>
      <div class="step" id="step-2-bar"></div>
    </div>

    <div id="alert-box" class="alert" role="alert"></div>

    <!-- ── Step 1: Details ── -->
    <div class="panel active" id="panel-1">
      <form id="register-form" novalidate>
        <div class="field">
          <label for="phone">Phone Number</label>
          <div class="input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" /></svg>
            <input type="tel" id="phone" placeholder="+91 98765 43210" autocomplete="tel" required />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>
            <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" data-target="password" aria-label="Toggle password">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            </button>
          </div>
          <div class="pw-strength">
            <div class="pw-bar" id="bar1"></div>
            <div class="pw-bar" id="bar2"></div>
            <div class="pw-bar" id="bar3"></div>
            <div class="pw-bar" id="bar4"></div>
          </div>
          <div class="pw-label" id="pw-label"></div>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" /></svg>
            <input type="password" id="confirm-password" placeholder="Re-enter password" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" data-target="confirm-password" aria-label="Toggle password">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="reg-btn">
          <span id="reg-btn-text">Send OTP</span>
          <div class="spinner" id="reg-spinner"></div>
        </button>
      </form>
    </div>

    <!-- ── Step 2: OTP Verify ── -->
    <div class="panel" id="panel-2">
      <p class="otp-hint">We sent a 6-digit code to <span id="phone-display"></span><br/>Enter it below to activate your account.</p>

      <div class="field">
        <label for="otp">OTP Code</label>
        <div class="input-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M7.864 4.243A7.5 7.5 0 0119.5 10.5c0 2.92-.556 5.709-1.568 8.268M5.742 6.364A7.465 7.465 0 004.5 10.5a7.464 7.464 0 01-1.15 3.993m1.989 3.559A11.209 11.209 0 008.25 10.5a3.75 3.75 0 117.5 0c0 .527-.021 1.049-.064 1.565M12 10.5a14.94 14.94 0 01-3.6 9.75m6.633-4.596a18.666 18.666 0 01-2.485 5.33" /></svg>
          <input type="text" id="otp" placeholder="123456" maxlength="6" autocomplete="one-time-code" required />
        </div>
      </div>

      <button class="btn-primary" id="verify-btn">
        <span id="verify-btn-text">Verify & Activate</span>
        <div class="spinner" id="verify-spinner"></div>
      </button>

      <div class="resend-wrap">
        <button id="resend-btn" disabled>Resend OTP (<span id="resend-timer">60</span>s)</button>
      </div>

      <button class="btn-secondary" id="back-btn">← Change Details</button>
    </div>

    <div class="links">
      Already have an account? <a href="/">Sign In</a>
    </div>
  </div>

  <script>
    const alertBox = document.getElementById('alert-box');
    let phoneValue = '';

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className   = `alert ${type}`;
      alertBox.style.display = 'block';
    }
    function hideAlert() { alertBox.style.display = 'none'; }

    function setLoading(btnId, spinnerId, loading) {
      document.getElementById(btnId).disabled = loading;
      const btnSpan = document.getElementById(btnId.replace('btn', 'btn-text'));
      if (btnSpan) btnSpan.style.display = loading ? 'none' : 'inline';
      document.getElementById(spinnerId).style.display = loading ? 'block' : 'none';
    }

    // Toggle password buttons
    document.querySelectorAll('.toggle-pw').forEach(btn => {
      btn.addEventListener('click', () => {
        const inp = document.getElementById(btn.dataset.target);
        inp.type = inp.type === 'password' ? 'text' : 'password';
      });
    });

    // Password strength meter
    const pwInput = document.getElementById('password');
    pwInput.addEventListener('input', () => {
      const v = pwInput.value;
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const colors = ['', '#f87171', '#f59e0b', '#34d399', '#6366f1'];
      const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`bar${i}`).style.background = i <= score ? colors[score] : 'var(--border)';
      }
      document.getElementById('pw-label').textContent = v ? labels[score] : '';
      document.getElementById('pw-label').style.color = colors[score] || 'var(--muted)';
    });

    // Step 1 — Register form submit
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      phoneValue = document.getElementById('phone').value.trim();
      const password        = pwInput.value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!phoneValue || !password || !confirmPassword) { showAlert('All fields are required.'); return; }
      if (password !== confirmPassword) { showAlert('Passwords do not match.'); return; }
      if (password.length < 8) { showAlert('Password must be at least 8 characters.'); return; }

      setLoading('reg-btn', 'reg-spinner', true);
      try {
        const res  = await fetch('/api/auth/register/', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ phone_number: phoneValue, password, confirm_password: confirmPassword })
        });
        const data = await res.json();
        if (res.ok || res.status === 201) {
          goToStep2();
        } else {
          showAlert(data.error || 'Registration failed.');
        }
      } catch { showAlert('Network error. Please try again.'); }
      finally { setLoading('reg-btn', 'reg-spinner', false); }
    });

    function goToStep2() {
      hideAlert();
      document.getElementById('panel-1').classList.remove('active');
      document.getElementById('panel-2').classList.add('active');
      document.getElementById('step-1-bar').classList.remove('active');
      document.getElementById('step-1-bar').classList.add('done');
      document.getElementById('step-2-bar').classList.add('active');
      document.getElementById('phone-display').textContent = phoneValue;
      startResendTimer();
    }

    // Resend timer
    let timerInterval;
    function startResendTimer() {
      let secs = 60;
      const resendBtn   = document.getElementById('resend-btn');
      const timerSpan   = document.getElementById('resend-timer');
      resendBtn.disabled = true;
      timerSpan.textContent = secs;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secs--;
        timerSpan.textContent = secs;
        if (secs <= 0) {
          clearInterval(timerInterval);
          resendBtn.disabled = false;
          resendBtn.textContent = 'Resend OTP';
        }
      }, 1000);
    }

    document.getElementById('resend-btn').addEventListener('click', async () => {
      try {
        const res  = await fetch('/api/auth/send-otp/', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ phone_number: phoneValue, purpose: 'register' })
        });
        const data = await res.json();
        if (res.ok) { showAlert('OTP resent!', 'success'); startResendTimer(); }
        else        { showAlert(data.error || 'Failed to resend OTP.'); }
      } catch { showAlert('Network error.'); }
    });

    // Step 2 — Verify OTP
    document.getElementById('verify-btn').addEventListener('click', async () => {
      hideAlert();
      const otp = document.getElementById('otp').value.trim();
      if (!otp) { showAlert('Please enter the OTP.'); return; }

      setLoading('verify-btn', 'verify-spinner', true);
      try {
        const res  = await fetch('/api/auth/verify-otp/', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ phone_number: phoneValue, otp, purpose: 'register' })
        });
        const data = await res.json();
        if (res.ok) {
          if (data.access) {
            localStorage.setItem('access_token',  data.access);
            localStorage.setItem('refresh_token', data.refresh);
          }
          showAlert('Account activated! Redirecting…', 'success');
          clearInterval(timerInterval);
          setTimeout(() => window.location.href = '/chat/', 1000);
        } else {
          showAlert(data.error || 'OTP verification failed.');
        }
      } catch { showAlert('Network error.'); }
      finally { setLoading('verify-btn', 'verify-spinner', false); }
    });

    // Back button
    document.getElementById('back-btn').addEventListener('click', () => {
      hideAlert();
      clearInterval(timerInterval);
      document.getElementById('panel-2').classList.remove('active');
      document.getElementById('panel-1').classList.add('active');
      document.getElementById('step-2-bar').classList.remove('active');
      document.getElementById('step-1-bar').classList.remove('done');
      document.getElementById('step-1-bar').classList.add('active');
    });
  </script>
</body>
</html>
