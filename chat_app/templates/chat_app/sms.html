{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send SMS — Chat App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'chat_app/sms.css' %}">
</head>
<body>
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>

  <div class="card">
    <div class="top-row">
      <a href="{% url 'chat_dashboard' %}" class="back-link" title="Back to chat">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </a>
      <h1>Send SMS</h1>
      <span class="spacer"></span>
    </div>
    <p class="subtitle">Sends a real text message to the receiver's phone via Twilio.</p>

    <div id="alert-box" class="alert" role="alert"></div>

    <form id="sms-form" novalidate>
      <div class="field">
        <label for="sender">From (your Twilio number)</label>
        <input type="text" id="sender" value="Configured on server (fixed)" disabled />
      </div>

      <div class="field">
        <label for="receiver">Receiver Phone Number</label>
        <input
          type="tel"
          id="receiver"
          name="to"
          placeholder="+91XXXXXXXXXX"
          autocomplete="off"
          required
        />
        <div class="field-error" id="receiver-error"></div>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          maxlength="160"
          rows="4"
          placeholder="Type your message..."
          required
        ></textarea>
        <div class="char-count"><span id="char-count">0</span>/160</div>
      </div>

      <button type="submit" class="btn-primary" id="send-btn">
        <span id="btn-text">Send SMS</span>
        <div class="spinner" id="btn-spinner"></div>
      </button>
    </form>

    <div id="status-panel" class="status-panel" hidden>
      <div class="status-row">
        <span class="status-label">Delivery status:</span>
        <span class="status-badge" id="status-badge">—</span>
      </div>
      <div class="status-meta" id="status-meta"></div>
    </div>
  </div>

  <script>
    const currentUserPhone = "{{ current_user.phone_number|escapejs }}";
  </script>
  <script src="{% static 'chat_app/sms.js' %}"></script>
</body>
</html>
