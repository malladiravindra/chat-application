{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'chat_app/chat.css' %}">
</head>
<body>
    <div class="app-window">
        <div class="chat-window">
            <div class="chat-header">
                <div class="header-user">
                    <span id="header-status-dot" class="status-dot online"></span>
                    <div class="header-user-info">
                        <div class="name">Live Chat</div>
                        <div class="status" id="header-status-text">Active now</div>
                    </div>
                </div>
                <a href="{% url 'sms' %}" class="logout-btn" title="Send SMS" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 4px; color: #b0bec5; display: flex; align-items: center; justify-content: center; text-decoration: none; margin-right: 8px;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </a>
                <a href="{% url 'logout' %}" class="logout-btn" title="Logout" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 4px; color: #b0bec5; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" x2="9" y1="12" y2="12"></line>
                    </svg>
                </a>
            </div>

            <div class="messages-container" id="messages-container">
                {% for message in messages %}
                    <div class="message-row {% if message.sender == current_user %}sent{% else %}received{% endif %}">
                        <div class="message-bubble">
                            <div class="message-content">{{ message.content }}</div>
                        </div>
                        <div class="message-meta">
                            {{ message.timestamp|date:"H:i" }} {{ message.sender.phone_number }}
                        </div>
                    </div>
                {% empty %}
                    <div style="margin: auto; text-align: center; color: var(--text-muted); font-size: 14px;" id="no-messages-placeholder">
                        No messages yet. Send a message to start!
                    </div>
                {% endfor %}
                <div class="message-row received" id="typing-bubble" style="display: none; margin-bottom: 8px;">
                    <div class="message-bubble typing-bubble">
                        <div class="typing-dots">
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                    </div>
                    <div class="message-meta" id="typing-meta-text">typing...</div>
                </div>
            </div>

            <div class="input-bar">
                <form class="input-form" id="chat-form">
                    <input type="text" class="message-input" id="chat-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" class="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px; transform: translateX(1px);">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script>
        const currentUserId = parseInt("{{ current_user.id }}");
    </script>
    <script src="{% static 'chat_app/chat.js' %}"></script>
</body>
</html>
